<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EasyVtuber Elite v2 🌸</title>
    <link rel="canonical" href="./docs/" />
    <!--
      The deployable web app is the Vite build in ./docs (see
      .github/workflows/deploy-pages.yml). This file used to be a second,
      hand-committed rolldown build with its own stale bundle and its own
      Content-Security-Policy — which was missing 'wasm-unsafe-eval', so the
      MediaPipe WASM module could not compile, plus api.github.com and the
      avatar hosts, so contributors broke. Rather than maintain two builds,
      this page just forwards to the real one.
    -->
    <meta http-equiv="refresh" content="0; url=./docs/" />
    <script>
      window.location.replace('./docs/');
    </script>
  </head>
  <body>
    <p>
      Redirecting to the <a href="./docs/">EasyVtuber web app</a>&hellip;
    </p>
  </body>
