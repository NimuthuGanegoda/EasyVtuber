# Tests and lint for the desktop (Python) app.
#
# This workflow previously triggered only on a branch named "Development", which
# does not exist in this repository — so it never ran. It also ran a bare
# `pytest` with nothing installed (there is no root requirements.txt), which
# collected zero tests and reported success.

name: Python tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: desktop/requirements/requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # Deliberately the light dev set: no wxpython/mediapipe/onnxruntime,
          # which keeps this job to ~30s instead of pulling multi-GB wheels.
          python -m pip install -r desktop/requirements/requirements-dev.txt

      # Deliberately one line: a trailing backslash is a bash-only line
      # continuation. On windows-latest the default shell is pwsh, which passes
      # the "\" through as an extra path argument, so flake8 was handed the
      # drive root and failed on every Windows job.
      - name: Lint (syntax errors and undefined names only)
        run: python -m flake8 desktop/backend desktop/gui desktop/tests --extend-exclude=desktop/backend/core/tha4/src --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests
        run: python -m pytest desktop/tests -q
