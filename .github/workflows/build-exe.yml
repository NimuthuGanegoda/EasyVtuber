name: Build Windows Client EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # We only install CPU versions for the lightweight client
        pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
        # Install wxpython for the UI
        pip install wxpython requests Pillow onnxruntime-openvino numpy scipy protobuf pynput mediapipe==0.10.11 opencv-python pyanime4k==3.1.0 pyvirtualcam==0.9.1 pyopengl onnx tqdm OneEuroFilter sounddevice brotli
        pip install pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        cd desktop
        # Ensure directories exist for PyInstaller
        if (!(Test-Path "data")) { New-Item -ItemType Directory -Path "data" }
        if (!(Test-Path "backend/data/images")) { New-Item -ItemType Directory -Path "backend/data/images" }
        
        # We bundle the launcher and core backend. 
        # We map images to both 'data/images' (for launcher) and 'backend/data/images' (for backend logic)
        pyinstaller --noconfirm --onedir --windowed --name "EasyVtuberClient" `
          --add-data "backend/data/images;data/images" `
          --add-data "backend/data/images;backend/data/images" `
          --add-data "backend;backend" `
          --add-data "main.py;." `
          --paths "." `
          "gui/launcher2.py"
        
    - name: Create ZIP
      run: |
        Compress-Archive -Path dist\EasyVtuberClient\* -DestinationPath EasyVtuberClient.zip

    - name: Create Release and Upload Client
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: EasyVtuberClient.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
