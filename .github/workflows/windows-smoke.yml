name: Windows Smoke

on:
  pull_request:
    branches: [ "Development", "main" ]
  push:
    branches: [ "Development" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements/requirements-core.txt
          pip install -r desktop/requirements/requirements-windows-optional.txt
          pip install pytest

      - name: Run Windows smoke tests
        run: pytest -q desktop/tests/test_windows_smoke.py
