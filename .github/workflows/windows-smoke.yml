name: Windows Smoke

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements/requirements-core.txt
          pip install -r desktop/requirements/requirements-windows-optional.txt
          pip install -r desktop/requirements/requirements-dev.txt

      - name: Run desktop test suite
        run: python -m pytest desktop/tests -q
