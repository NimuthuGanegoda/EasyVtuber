[pytest]
# Run from the repository root (`pytest`) or from desktop/ — rootdir resolves here.
testpaths = desktop/tests
# The vendored runtime tests under desktop/ezvtuber-rt/test are named *_test.py,
# need a GPU and real ONNX weights, and are not part of this suite — see that
# folder's README for how to run them.
norecursedirs = desktop/ezvtuber-rt desktop/backend/core node_modules .git
python_files = test_*.py
